# Phrase lists used by pipeline/style.py. Sources: research/E_writing_quality.md section 2.3
# (banned and discouraged AI-tell lists), the measured corpus (research/A appendix, appendix A section A8),
# and the candidate's own edits over time (add to `personal_banned` when the candidate deletes a phrase from a draft).

