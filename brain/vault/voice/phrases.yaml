discouraged:       # counted per 300 words; more than 3 flags the draft
  - "crucial"
  - "enhancing"
  - "notably"
  - "comprehensive"
  - "in today's"
  - "in order to"       # the candidate writes "to"; two uses in 29,000 words (T-039, 2026-09-23)
  - "not only"
  - "but also"
  - furthermore
  - moreover
  - additionally
  - arguably
  - "it is worth noting"
  - importantly
  - "commitment to excellence"
  - "align with my values"
  - "aligns with my values"
  - fast-paced
  - dynamic
  - thrive
  - thriving
  - "excited to"
  - "exciting opportunity"
  - impactful
  - utilise
  - utilize
  - utilising
  - utilizing
  - "proven track record"
  - "results-driven"
  - "detail-oriented"
  - "strategic thinker"
  - helped             # the candidate (2026-09-23): "supported" instead of "helped" for his own contributions
  - monitored          # the candidate (2026-09-23): "tracked" (implies analysis and judgement); "monitored" reads weak

personal_banned:   # phrases the candidate has removed from drafts; grows over time
  - "i am passionate about finance"
  - "dynamic fast-paced environment"

positive_checklist:
  - one concrete, ledger-backed detail (number, name, place or date) in every paragraph
  - sentence lengths that vary; standard deviation at least 40% of the mean
  - at least one sentence only the candidate could have written
  - a firm-specific reason tied to a dated source
  - UK spelling and conventions; "Yours sincerely" to a named contact, "Yours faithfully" otherwise; "Kind regards" in emails
  - a plain closing with a next step, no summary sentence
  - within the word limit with at least 5% headroom
